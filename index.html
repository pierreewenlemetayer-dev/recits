<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Récits – Lire et comprendre</title><style>
:root{font-family:Verdana,Arial,sans-serif;color:#253342;background:#f5f8fa}*{box-sizing:border-box}body{margin:0}header{text-align:center;background:#174969;color:white;padding:30px 12px 24px}header h1{font-size:2.5rem;margin:0}header p{margin:6px 0 0}main{max-width:950px;margin:24px auto;padding:0 16px}.panel{background:white;border:1px solid #d8e2e8;border-radius:12px;padding:22px;margin-bottom:18px;box-shadow:0 2px 8px #1c344010}.controls{display:flex;flex-wrap:wrap;align-items:end;gap:16px}.control{display:grid;gap:7px}button{font:inherit;cursor:pointer;background:#21668d;border:0;color:white;padding:10px 15px;border-radius:7px}button:hover{background:#144c70}button:disabled{opacity:.55;cursor:not-allowed}button.secondary{background:#e4edf3;color:#173d58}button.secondary:hover{background:#d3e2ec}input[type=number]{font:inherit;padding:9px;border:1px solid #a7bbc7;border-radius:6px;width:90px}.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.muted{color:#61727f}.small{font-size:.8rem}.source{font-size:.73rem;color:#74818a;margin-top:22px;border-top:1px solid #e5eaee;padding-top:12px}.bibliography{font-size:.89rem;color:#556a79;margin-bottom:10px}h2{margin-top:0;color:#174969}h3{color:#174969}.story{line-height:1.8;font-size:1.05rem;white-space:pre-line}.question{padding:15px 0;border-bottom:1px solid #e5eaee}.question legend{font-weight:700;padding-bottom:9px}.question label{display:block;margin:8px 0;padding:8px;border-radius:6px;cursor:pointer}.question label:hover{background:#f0f6f9}.question label.correct{background:#e5f5eb}.question label.incorrect{background:#fdecec}.question input{margin-right:9px}.hidden{display:none!important}.status{padding:10px 12px;border-radius:6px;background:#eef5f8;margin-top:12px}.error{background:#fff0f0;color:#922c2c}footer{text-align:center;color:#647785;padding:24px;font-size:.82rem}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.quizsetting{border:1px solid #dbe4e9;border-radius:8px;padding:12px;margin:14px 0}.quizsetting label{margin-right:16px}.count{margin:0 0 12px;color:#536c7a}#score{font-size:1.2rem;font-weight:700;margin-top:15px}.answerNote{font-size:.86rem;color:#345b47;margin:4px 0 10px 28px}@media print{header,.controls,.actions,.quizsetting,footer,.noPrint{display:none!important}body{background:white}.panel{box-shadow:none;border:0;padding:0}main{margin:0;max-width:none}.question{break-inside:avoid}body.print-text #quiz{display:none!important}body.print-result #reader{display:none!important}body.print-text #reader{display:block!important}body.print-result #quiz{display:block!important}#reader:not(.hidden) .source{display:block}}
</style></head><body><header><h1>Récits</h1><p>Lire et comprendre</p></header><main><section class="panel noPrint"><div class="controls"><div class="control"><label>Découvrir un texte</label><button id="random">Texte au hasard</button></div><div class="control"><label for="number">Choisir un numéro</label><div class="line"><input id="number" type="number" min="1" placeholder="N°"><button id="choose">Afficher</button></div></div></div><p id="total" class="muted small" aria-live="polite">Chargement du corpus…</p><p id="loadError" class="status error hidden" role="alert"></p></section><section id="reader" class="panel hidden"><div id="bibliography" class="bibliography hidden"></div><h2 id="title"></h2><p id="numberLabel" class="count"></p><article id="story" class="story"></article><p id="attribution" class="source"></p><div class="quizsetting noPrint"><strong>Affichage du corrigé</strong><div class="line" style="margin-top:9px"><label><input type="radio" name="correction" value="end" checked> À la fin</label><label><input type="radio" name="correction" value="progressive"> Progressif</label></div></div><div class="actions noPrint"><button id="withText">QCM en gardant le texte</button><button id="withoutText" class="secondary">QCM sans le texte</button><button id="printText" class="secondary">Imprimer le texte</button></div></section><section id="quiz" class="panel hidden"><h2>Questionnaire de compréhension</h2><p id="quizHeading" class="muted"></p><form id="quizForm"></form><div class="actions noPrint"><button id="submit" type="button">Valider mes réponses</button><button id="correctionButton" type="button" class="secondary hidden">Voir le corrigé</button><button id="printResult" type="button" class="secondary hidden">Imprimer / enregistrer en PDF</button><button id="back" type="button" class="secondary">Revenir au texte</button></div><div id="score" aria-live="polite"></div></section></main><footer>© Récits – Pierre Lemétayer – 2026</footer><script>
'use strict';
const $=id=>document.getElementById(id);let corpus=[],current=null,mode='end',withText=true,submitted=false;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(data){if(!Array.isArray(data)||!data.length)throw Error('Corpus absent ou vide.');const ids=new Set();for(const r of data){if(!Number.isInteger(r.numero)||ids.has(r.numero)||!r.titre||!r.texte||!Array.isArray(r.qcm)||r.qcm.length!==10)throw Error('Structure invalide : récit '+r.numero);ids.add(r.numero);for(let i=0;i<10;i++){const q=r.qcm[i];if(q.numero!==i+1||!q.question||!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>typeof x!=='string'||!x.trim())||new Set(q.options.map(x=>x.trim())).size!==4||!Number.isInteger(q.reponse)||q.reponse<0||q.reponse>3)throw Error('QCM invalide : récit '+r.numero+', question '+(i+1));}}return data.sort((a,b)=>a.numero-b.numero)}
function attribution(r){if(r.origine==='ia')return 'Sauf mention contraire, les textes et les QCM ont été générés par une I.A., relus et corrigés par un humain';return 'Texte : '+[r.auteur,r.oeuvre,r.date_parution].filter(Boolean).join(', ')+'. QCM généré avec une I.A., relu et corrigé par un humain.'}
function show(r){current=r;submitted=false;$('number').value=r.numero;$('reader').classList.remove('hidden');$('quiz').classList.add('hidden');$('title').textContent=r.titre;$('numberLabel').textContent='Texte n° '+r.numero;$('story').textContent=r.texte;$('attribution').textContent=attribution(r);const b=[r.auteur,r.oeuvre,r.date_parution].filter(Boolean).join(' — ');$('bibliography').textContent=b;$('bibliography').classList.toggle('hidden',!b);$('reader').scrollIntoView({behavior:'smooth',block:'start'})}
function pick(n){const r=corpus.find(x=>x.numero===n);if(!r){alert('Aucun récit ne porte ce numéro.');return}show(r)}
function startQuiz(keep){withText=keep;mode=document.querySelector('input[name="correction"]:checked').value;submitted=false;$('quiz').classList.remove('hidden');$('reader').classList.toggle('hidden',!keep);$('quizHeading').textContent=current.titre+' — Texte n° '+current.numero;$('score').textContent='';$('submit').classList.remove('hidden');$('correctionButton').classList.add('hidden');$('printResult').classList.add('hidden');const form=$('quizForm');form.replaceChildren();for(const q of current.qcm){const f=document.createElement('fieldset');f.className='question';f.style.border='0';const l=document.createElement('legend');l.textContent=q.numero+'. '+q.question;f.append(l);q.options.forEach((opt,i)=>{const label=document.createElement('label');const inp=document.createElement('input');inp.type='radio';inp.name='q'+q.numero;inp.value=String(i);if(mode==='progressive')inp.addEventListener('change',()=>{if(label.dataset.locked)return;f.querySelectorAll('input').forEach(el=>el.disabled=true);f.querySelectorAll('label').forEach((el,j)=>{if(j===q.reponse)el.classList.add('correct');else if(el.contains(inp)&&i!==q.reponse)el.classList.add('incorrect')});f.dataset.answered='1';});label.append(inp,document.createTextNode(' '+String.fromCharCode(97+i)+'. '+opt));f.append(label)});form.append(f)}$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}
function showAnswers(){[...$('quizForm').children].forEach((f,i)=>{const q=current.qcm[i];f.querySelectorAll('label').forEach((l,j)=>{if(j===q.reponse)l.classList.add('correct');else if(l.querySelector('input').checked)l.classList.add('incorrect')})});$('correctionButton').classList.add('hidden')}
function submit(){if(submitted)return;const fields=[...$('quizForm').children];const answered=fields.filter(f=>f.querySelector('input:checked')).length;if(answered<10&&!confirm('Tu as répondu à '+answered+' question(s) sur 10. Valider quand même ?'))return;let score=0;fields.forEach((f,i)=>{const checked=f.querySelector('input:checked');if(checked&&Number(checked.value)===current.qcm[i].reponse)score++;f.querySelectorAll('input').forEach(x=>x.disabled=true)});submitted=true;$('score').textContent='Résultat : '+score+' / 10';$('submit').classList.add('hidden');$('printResult').classList.remove('hidden');if(mode==='progressive')showAnswers();else $('correctionButton').classList.remove('hidden')}
$('random').addEventListener('click',()=>show(corpus[Math.floor(Math.random()*corpus.length)]));$('choose').addEventListener('click',()=>pick(Number($('number').value)));$('number').addEventListener('keydown',e=>{if(e.key==='Enter')pick(Number(e.target.value))});$('withText').addEventListener('click',()=>startQuiz(true));$('withoutText').addEventListener('click',()=>startQuiz(false));$('submit').addEventListener('click',submit);$('correctionButton').addEventListener('click',showAnswers);$('back').addEventListener('click',()=>{$('quiz').classList.add('hidden');$('reader').classList.remove('hidden');$('reader').scrollIntoView()});function printSection(section){document.body.classList.remove('print-text','print-result');document.body.classList.add('print-'+section);window.print()}window.addEventListener('afterprint',()=>document.body.classList.remove('print-text','print-result'));$('printText').addEventListener('click',()=>printSection('text'));$('printResult').addEventListener('click',()=>printSection('result'));
fetch('corpus.json').then(r=>{if(!r.ok)throw Error('Fichier corpus.json inaccessible');return r.json()}).then(data=>{corpus=validate(data);$('total').textContent=corpus.length+' textes disponibles, chacun avec 10 questions et un corrigé.';$('number').max=Math.max(...corpus.map(r=>r.numero));$('number').placeholder=corpus[0].numero+'–'+corpus[corpus.length-1].numero;}).catch(err=>{$('total').textContent='Corpus indisponible.';$('loadError').textContent='Impossible de charger les récits : '+err.message+'. Le site doit être ouvert depuis un serveur web (GitHub Pages, par exemple).';$('loadError').classList.remove('hidden');$('random').disabled=true;$('choose').disabled=true});
</script></body></html>
