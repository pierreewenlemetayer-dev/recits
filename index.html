p:10px;margin-top:16px}.quizsetting{border:1px solid #dbe4e9;border-radius:8px;padding:12px;margin:14px 0}.quizsetting label{margin-right:16px}.count{margin:0 0 12px;color:#536c7a}#score{font-size:1.2rem;font-weight:700;margin-top:15px}.difficulty{margin:0 0 16px;padding:11px 13px;border-radius:8px;background:#f2f7fa}.stars{font-size:1.3rem;letter-spacing:1px;color:#bf8516}.stars .empty{color:#c9d2d8}.metric{font-size:.85rem;color:#536878;margin-top:5px}.help{cursor:help;border-bottom:1px dotted #536878}.timerbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;background:#edf4f8;border:1px solid #d1e2ed;border-radius:9px;margin-bottom:12px}.timerbar strong{font-variant-numeric:tabular-nums;font-size:1.25rem;color:#174969}.timerbar button{padding:6px 10px}.timerbar.bottom{margin-top:18px}.pdfrow{border-top:1px solid #e0e8ed;padding-top:13px}.printOnly{display:none}.answerNote{font-size:.86rem;color:#345b47;margin:4px 0 10px 28px}@media print{.printOnly{display:block!important}body.print-text #printSheet,body.print-qcm #printSheet,body.print-both #printSheet{display:block!important}body.print-text main,body.print-qcm main,body.print-both main{display:none!important}body.print-text header,body.print-qcm header,body.print-both header{display:none!important}body.print-text footer,body.print-qcm footer,body.print-both footer{display:none!important}#printSheet{font-family:Verdana,Arial,sans-serif;font-size:10.5pt;color:black}#printSheet h1{font-size:17pt;margin-bottom:8px}#printSheet h2{font-size:13pt;margin:16px 0 7px}#printSheet .printStory{white-space:pre-line;line-height:1.5}#printSheet .printQuestion{break-inside:avoid;margin:11px 0}#printSheet .printQuestion strong{display:block;margin-bottom:5px}#printSheet .printOption{margin:3px 0 3px 13px}header,.controls,.actions,.quizsetting,footer,.noPrint{display:none!important}body{background:white}.panel{box-shadow:none;border:0;padding:0}main{margin:0;max-width:none}.question{break-inside:avoid}bod /* Identité visuelle harmonisée avec Lañs et Leien */
:root{--fond:#f2f5f8;--papier:#fffefe;--texte:#29313a;--secondaire:#6b7781;--accent:#426f93;--accent-fonce:#285678;--accent-pale:#e2edf5;--bordure:#d4e0e8;--ombre:0 8px 25px rgba(40,70,95,.08);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--texte);background:var(--fond)}
body{background:var(--fond);color:var(--texte);line-height:1.5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{text-align:center;background:transparent;color:var(--texte);padding:42px 20px 28px}
header h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(3rem,8vw,5.5rem);font-weight:700;letter-spacing:-.04em;line-height:1;color:var(--texte)}
header p{margin:12px 0 0;color:var(--secondaire);font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.1rem,2.5vw,1.4rem);font-style:italic}
main{max-width:1000px;margin:0 auto 50px;padding:0 16px}
.panel{background:var(--papier);border:1px solid var(--bordure);border-radius:18px;padding:clamp(20px,4vw,38px);margin-bottom:20px;box-shadow:var(--ombre)}
.controls{justify-content:center;gap:14px}.control label{font-weight:600;font-size:.9rem}
button{background:var(--accent);border:1px solid var(--accent);border-radius:10px;color:white;padding:10px 15px;transition:background .18s ease,border-color .18s ease}
button:hover{background:var(--accent-fonce);border-color:var(--accent-fonce)}
button.secondary{background:transparent;color:var(--accent-fonce);border:1px solid var(--accent)}button.secondary:hover{background:var(--accent-pale)}
select,input[type=search],input[type=number]{border:1px solid var(--bordure);border-radius:10px;background:var(--papier);color:var(--texte);padding:10px}
h2,h3{color:var(--accent-fonce);font-family:Georgia,"Times New Roman",serif}
#title{font-size:clamp(1.6rem,3.3vw,2.3rem)}.story{color:var(--texte)}
.muted,.count,.metric{color:var(--secondaire)}.difficulty,.timerbar{background:var(--accent-pale);border-color:var(--bordure)}.timerbar strong{color:var(--accent-fonce)}
.actions{justify-content:center;gap:12px}.pdfrow{border-color:var(--bordure)}.source{color:var(--secondaire);border-color:var(--bordure)}footer{color:var(--secondaire)}
@media(max-width:700px){header{padding:32px 12px 24px}.panel{border-radius:16px}.controls{align-items:stretch}.control{min-width:0}}
@media print{body{background:white}header{display:none!important}.panel{box-shadow:none;border:0;border-radius:0}}

/* Étape A : sélection et navigation */
header h1{color:var(--accent-fonce)}
.difficultyPicker{display:flex;flex-wrap:wrap;gap:2px;align-items:center;justify-content:center}
.starChoice{font-size:clamp(1.35rem,2.7vw,2rem);line-height:1.2;border:0!important;border-radius:5px;padding:2px 4px;background:transparent!important;color:#c89b39;cursor:pointer;transition:transform .15s,color .15s}
.starChoice:hover,.starChoice:focus-visible{color:#a97312;transform:scale(1.2);outline-offset:2px}.starChoice:disabled{color:#cbd0d4;cursor:not-allowed;transform:none;opacity:.65}
#keywords{min-width:210px}#backToTop{display:block;text-align:right;margin:-12px max(18px,calc((100vw - 1000px)/2)) 24px;color:var(--accent-fonce);font-size:.85rem;text-decoration:none}#backToTop:hover{text-decoration:underline}
@media print{#backToTop{display:none!important}}

/* Trois sélecteurs sur une seule ligne, étoiles compactes */
.controls:not(.keywordControls){gap:12px;align-items:end;justify-content:space-between}
.controls:not(.keywordControls)>.control{min-width:0}
#difficultyPicker{flex-wrap:nowrap;gap:0;justify-content:flex-start;min-height:43px}
.starChoice{font-size:1.25rem;padding:3px 1px;min-width:20px}
.keywordControls{margin-top:18px;justify-content:center}
@media(max-width:850px){.controls:not(.keywordControls){justify-content:center;flex-wrap:wrap}.starChoice{min-width:19px}}
@media(max-width:520px){#difficultyPicker{flex-wrap:wrap;justify-content:center}.controls:not(.keywordControls){gap:16px}}

/* Centrage des intitulés par rapport à chaque groupe complet de commandes */
.controls:not(.difficultyControls) > .control{justify-items:center;text-align:center}
.controls:not(.difficultyControls) > .control > label{width:100%;text-align:center}
.controls:not(.difficultyControls) > .control > .line{justify-content:center}

/* Alignement des trois modes de recherche, difficulté centrée en dessous */
.controls.difficultyControls{justify-content:center;margin-top:20px}
.difficultyControls .control{align-items:center;text-align:center}
.difficultyControls #difficultyPicker{justify-content:center}
.controls:not(.keywordControls):not(.difficultyControls){justify-content:space-between;gap:12px}
@media(max-width:850px){.controls:not(.keywordControls):not(.difficultyControls){justify-content:center}}

/* Étape B : chronomètre discret et interrupteur synchronisé */
.readerTopLine{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.readerTopLine .difficulty{flex:1;min-width:0;margin:0}
.timerbar{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:nowrap;padding:0;margin:0;border:0;background:transparent!important;white-space:nowrap;color:#75818a;font-size:.77rem}
.timerbar strong{font-size:.85rem;color:#6c7780;font-weight:500;font-variant-numeric:tabular-nums}
.timerbar .timerToggle{font-size:.78rem;padding:4px 10px;border-radius:7px;background:#25844c;border-color:#25844c;color:white;font-weight:600}
.timerbar .timerToggle:hover{background:#1c6d3d;border-color:#1c6d3d}
.timerbar .timerToggle.running{background:#c83b3b;border-color:#c83b3b}
.timerbar .timerToggle.running:hover{background:#a92e2e;border-color:#a92e2e}
.storyFoot{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--bordure);margin-top:22px;padding-top:12px}
.storyFoot .source{border:0;margin:0;padding:0;flex:1;min-width:0}
.storyFoot .timerbar.bottom{margin:0;flex-shrink:0}
@media(max-width:700px){.readerTopLine,.storyFoot{flex-wrap:wrap}.readerTopLine .difficulty{flex-basis:100%}.readerTopLine .timerbar{margin-left:auto}.storyFoot .timerbar{margin-left:auto}}

/* Alignement du chronomètre et des réglages du corrigé */
.quizsetting{text-align:center}
.quizsetting .line{justify-content:center}

/* Étape C : identification et correction du questionnaire */
.studentName{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin:15px 0 20px}
.studentName label{font-weight:600;color:var(--accent-fonce)}
.studentName input{font:inherit;max-width:300px;width:100%;padding:10px;border:1px solid var(--bordure);border-radius:10px}
.question label.correct{background:#c5f2d0;color:#12632c;font-weight:600}
.question label.incorrect{background:#ffd2d2;color:#a21b1b;font-weight:600}
.question label.correct input{accent-color:#168b42}
.question label.incorrect input{accent-color:#d52c2c}
.question input:disabled{opacity:1}

/* Étape D : liens PDF discrets et feuille de résultats autonome */
.pdfrow{gap:20px}
button.pdfLink,button.pdfLink:hover{background:transparent!important;border:0!important;box-shadow:none;color:var(--accent-fonce);padding:4px 2px;border-radius:0;font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
button.pdfLink:hover{color:#153c5c}
@media print{
body.print-text main,body.print-qcm main,body.print-both main,body.print-result main{display:none!important}
body.print-text header,body.print-qcm header,body.print-both header,body.print-result header{display:none!important}
body.print-text footer,body.print-qcm footer,body.print-both footer,body.print-result footer{display:none!important}
body.print-text #printSheet,body.print-qcm #printSheet,body.print-both #printSheet,body.print-result #printSheet{display:block!important}
#backToTop{display:none!important}
#printSheet .printOption.right{color:#176b35}
#printSheet .printOption.wrong{color:#a52222}
body.print-result #printSheet .printQuestion{margin:9px 0}
body.print-result #printSheet .resultPrintHeader{text-align:center;margin-bottom:20px}
body.print-result #printSheet .resultPrintHeader h1,body.print-result #printSheet .resultPrintHeader h2{text-align:center}
}
</style></head><body id="top"><header><h1>Récits</h1><p>Lire et comprendre</p></header><main><section class="panel noPrint"><div class="controls"><div class="control"><label>Découvrir un texte</label><button id="random">Texte au hasard</button></div><div class="control"><label for="number">Choisir un numéro</label><div class="line"><input id="number" type="number" min="1" placeholder="N°"><button id="choose">Afficher</button></div></div><div class="control"><label for="keywords">Rechercher par mots-clés</label><div class="line"><select id="keywords"><option value="">Choisir un mot-clé</option></select><button id="searchText">Afficher un texte</button></div></div></div><div class="controls difficultyControls"><div class="control"><label id="difficultyPickerLabel">Choisir par niveau de difficulté</label><div id="difficultyPicker" class="difficultyPicker" role="group" aria-labelledby="difficultyPickerLabel"></div></div></div><p id="searchFeedback" class="muted small" aria-live="polite"></p><p id="loadError" class="status error hidden" role="alert"></p></section><section id="reader" class="panel hidden"><div id="bibliography" class="bibliography hidden"></div><h2 id="title"></h2><p id="numberLabel" class="count"></p><div class="readerTopLine"><div id="difficultyInfo" class="difficulty"></div><div class="timerbar noPrint"><span>Chronomètre</span><strong class="timerDisplay">00:00.00</strong><button type="button" class="timerToggle" aria-pressed="false">Go</button></div></div><article id="story" class="story"></article><div class="storyFoot"><p id="attribution" class="source"></p><div class="timerbar bottom noPrint"><span>Chronomètre</span><strong class="timerDisplay">00:00.00</strong><button type="button" class="timerToggle" aria-pressed="false">Go</button></div></div><div class="actions noPrint"><button id="withText">QCM en gardant le texte</button><button id="withoutText" class="secondary">QCM sans le texte</button></div><div class="quizsetting noPrint"><strong>Affichage du corrigé</strong><div class="line" style="margin-top:9px"><label><input type="radio" name="correction" value="end" checked> À la fin</label><label><input type="radio" name="correction" value="progressive"> Progressif</label></div></div><div class="actions pdfrow noPrint"><button id="printText" class="pdfLink">PDF du texte</button><button id="printQcm" class="pdfLink">PDF du QCM</button><button id="printBoth" class="pdfLink">PDF des deux</button></div></section><section id="quiz" class="panel hidden"><h2>Questionnaire de compréhension</h2><p id="quizHeading" class="muted"></p><div class="studentName"><label for="studentName">Nom (facultatif)</label><input id="studentName" type="text" maxlength="100" autocomplete="name" placeholder="Votre nom"></div><form id="quizForm"></form><div class="actions noPrint"><button id="submit" type="button">Valider mes réponses</button><button id="correctionButton" type="button" class="secondary hidden">Voir le corrigé</button><button id="printResult" type="button" class="pdfLink hidden">Imprimer / enregistrer en PDF</button></div><div id="score" aria-live="polite"></div></section></main><div id="printSheet" class="printOnly"></div><footer>© Récits – Pierre Lemétayer – 2026</footer><a href="#top" id="backToTop">↑ Haut de page</a><script>
'use strict';
const $=id=>document.getElementById(id);let corpus=[],current=null,mode='end',withText=true,submitted=false;let elapsed=0,timerStarted=0,timerHandle=null;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function validate(data){if(!Array.isArray(data)||!data.length)throw Error('Corpus absent ou vide.');const ids=new Set();for(const r of data){if(!Number.isInteger(r.numero)||ids.has(r.numero)||!r.titre||!r.texte||!Array.isArray(r.qcm)||r.qcm.length!==10)throw Error('Structure invalide : récit '+r.numero);ids.add(r.numero);for(let i=0;i<10;i++){const q=r.qcm[i];if(q.numero!==i+1||!q.question||!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>typeof x!=='string'||!x.trim())||new Set(q.options.map(x=>x.trim())).size!==4||!Number.isInteger(q.reponse)||q.reponse<0||q.reponse>3)throw Error('QCM invalide : récit '+r.numero+', question '+(i+1));}}return data.sort((a,b)=>a.numero-b.numero)}
function attribution(r){if(r.origine==='ia')return 'Sauf mention contraire, les textes et les QCM ont été générés par une I.A., relus et corrigés par un humain.';return 'Texte : '+[r.auteur,r.oeuvre,r.date_parution].filter(Boolean).join(', ')+'. QCM généré avec une I.A., relu et corrigé par un humain.'}
function show(r){current=r;submitted=false;$('withText').disabled=false;$('withoutText').disabled=false;$('number').value=r.numero;$('reader').classList.remove('hidden');$('quiz').classList.add('hidden');$('title').textContent=r.titre;$('numberLabel').textContent='Texte n° '+r.numero;$('story').textContent=r.texte;const d=$('difficultyInfo');const filled='★'.repeat(r.etoiles||0),empty='☆'.repeat(12-(r.etoiles||0));d.innerHTML='<div><strong>Difficulté :</strong> <span class="stars">'+filled+'<span class="empty">'+empty+'</span></span> ('+(r.etoiles||'?')+'/12)</div><div class="metric">'+r.mots+' mots · <span class="help" title="JLisi : indice à dominante lexicale. Plus le score est élevé, plus le texte est difficile.">JLisi : '+r.jlisi.toFixed(1)+'</span> · <span class="help" title="Kandel-Moles : indice à dominante morphologique et phrastique. Plus le score est faible, plus le texte est difficile. Calcul expérimental.">Kandel-Moles : '+r.kandel_moles.toFixed(1)+'</span></div>';resetTimer();$('attribution').textContent=attribution(r);const b=[r.auteur,r.oeuvre,r.date_parution].filter(Boolean).join(' — ');$('bibliography').textContent=b;$('bibliography').classList.toggle('hidden',!b);$('reader').scrollIntoView({behavior:'smooth',block:'start'})}
const KEYWORDS=['amitié','amour','animaux','aventure','bibliothèque','courage','découverte','école','enfance','enquête','famille','fantôme','forêt','guerre','histoire','île','japon','liberté','mer','mystère','nature','peur','rêve','secret','solidarité','théâtre','trésor','voyage'];
function norm(s){return String(s).normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase()}
function matchesKeyword(r,k){return new RegExp('(^|[^a-z])'+norm(k)+'[a-z]{0,3}([^a-z]|$)','i').test(norm(r.titre+' '+r.texte))}
function renderDifficultyPicker(){const p=$('difficultyPicker');p.replaceChildren();for(let n=1;n<=12;n++){const count=corpus.filter(r=>r.etoiles===n).length;const b=document.createElement('button');b.type='button';b.className='starChoice';b.textContent='★';b.title=n+' étoile'+(n>1?'s':'')+' : '+count+' texte'+(count>1?'s':'')+' disponible'+(count>1?'s':'');b.setAttribute('aria-label',b.title);b.disabled=count===0;b.addEventListener('click',()=>{const pool=corpus.filter(r=>r.etoiles===n);if(pool.length)show(pool[Math.floor(Math.random()*pool.length)])});p.append(b)}}
function renderKeywords(){const sel=$('keywords');sel.length=1;for(const k of KEYWORDS){const count=corpus.filter(r=>matchesKeyword(r,k)).length;if(!count)continue;const option=document.createElement('option');option.value=k;option.textContent=k[0].toUpperCase()+k.slice(1)+' ('+count+')';sel.append(option)}}
function pick(n){const r=corpus.find(x=>x.numero===n);if(!r){alert('Aucun récit ne porte ce numéro.');return}show(r)}
function startQuiz(keep){if(submitted&&$('quiz').classList.contains('hidden')===false)return;pauseTimer();withText=keep;mode=document.querySelector('input[name="correction"]:checked').value;submitted=false;$('quiz').classList.remove('hidden');$('reader').classList.toggle('hidden',!keep);$('quizHeading').textContent=current.titre+' — Texte n° '+current.numero;$('studentName').value='';$('withText').disabled=true;$('withoutText').disabled=true;$('score').textContent='';$('submit').classList.remove('hidden');$('correctionButton').classList.add('hidden');$('printResult').classList.add('hidden');const form=$('quizForm');form.replaceChildren();for(const q of current.qcm){const f=document.createElement('fieldset');f.className='question';f.style.border='0';const l=document.createElement('legend');l.textContent=q.numero+'. '+q.question;f.append(l);q.options.forEach((opt,i)=>{const label=document.createElement('label');const inp=document.createElement('input');inp.type='radio';inp.name='q'+q.numero;inp.value=String(i);if(mode==='progressive')inp.addEventListener('change',()=>{if(f.dataset.answered==='1'||submitted)return;f.querySelectorAll('input').forEach(el=>el.disabled=true);f.querySelectorAll('label').forEach((el,j)=>{if(j===q.reponse)el.classList.add('correct');else if(el.contains(inp)&&i!==q.reponse)el.classList.add('incorrect')});f.dataset.answered='1';});label.append(inp,document.createTextNode(' '+String.fromCharCode(97+i)+'. '+opt));f.append(label)});form.append(f)}$('quiz').scrollIntoView({behavior:'smooth',block:'start'})}
function showAnswers(){[...$('quizForm').children].forEach((f,i)=>{const q=current.qcm[i];f.querySelectorAll('label').forEach((l,j)=>{if(j===q.reponse)l.classList.add('correct');else if(l.querySelector('input').checked)l.classList.add('incorrect')})});$('correctionButton').classList.add('hidden')}
function submit(){if(submitted)return;const fields=[...$('quizForm').children];const answered=fields.filter(f=>f.querySelector('input:checked')).length;if(answered<10&&!confirm('Tu as répondu à '+answered+' question(s) sur 10. Valider quand même ?'))return;let score=0;fields.forEach((f,i)=>{const checked=f.querySelector('input:checked');if(checked&&Number(checked.value)===current.qcm[i].reponse)score++;f.querySelectorAll('input').forEach(x=>x.disabled=true)});submitted=true;$('score').textContent='Résultat : '+score+' / 10';$('submit').classList.add('hidden');$('printResult').classList.remove('hidden');if(mode==='progressive')showAnswers();else $('correctionButton').classList.remove('hidden')}
let timerUsed=false;
function renderTimer(){const seconds=elapsed+(timerHandle!==null?(performance.now()-timerStarted)/1000:0);const centis=Math.floor(seconds*100);const t=String(Math.floor(centis/6000)).padStart(2,'0')+':'+String(Math.floor(centis/100)%60).padStart(2,'0')+'.'+String(centis%100).padStart(2,'0');document.querySelectorAll('.timerDisplay').forEach(e=>e.textContent=t);document.querySelectorAll('.timerToggle').forEach(b=>{const running=timerHandle!==null;b.textContent=running?'Stop':'Go';b.classList.toggle('running',running);b.setAttribute('aria-pressed',String(running))})}
function pauseTimer(){if(timerHandle!==null){elapsed+=(performance.now()-timerStarted)/1000;clearInterval(timerHandle);timerHandle=null}renderTimer()}
function resetTimer(){pauseTimer();elapsed=0;timerUsed=false;renderTimer()}
document.querySelectorAll('.timerToggle').forEach(b=>b.addEventListener('click',()=>{if(timerHandle!==null){pauseTimer()}else{timerUsed=true;timerStarted=performance.now();timerHandle=setInterval(renderTimer,20);renderTimer()}}));
function searchCorpus(){const k=$('keywords').value;if(!k){$('searchFeedback').textContent='Choisis un mot-clé.';return}const found=corpus.filter(r=>matchesKeyword(r,k));$('searchFeedback').textContent=found.length?found.length+' texte(s) pour « '+k+' ».' : 'Aucun texte trouvé.';if(found.length)show(found[Math.floor(Math.random()*found.length)])}
$('searchText').addEventListener('click',searchCorpus);$('keywords').addEventListener('keydown',e=>{if(e.key==='Enter')searchCorpus()});$('random').addEventListener('click',()=>show(corpus[Math.floor(Math.random()*corpus.length)]));$('choose').addEventListener('click',()=>pick(Number($('number').value)));$('number').addEventListener('keydown',e=>{if(e.key==='Enter')pick(Number(e.target.value))});$('withText').addEventListener('click',()=>startQuiz(true));$('withoutText').addEventListener('click',()=>startQuiz(false));$('submit').addEventListener('click',submit);$('correctionButton').addEventListener('click',showAnswers);function makePrintSheet(kind){const sheet=$('printSheet');sheet.replaceChildren();const header=kind==='result'?document.createElement('div'):sheet;if(kind==='result'){header.className='resultPrintHeader';sheet.append(header)}const title=document.createElement('h1');title.textContent='Récits – '+current.titre;header.append(title);const meta=document.createElement('p');meta.textContent='Texte n° '+current.numero+' · '+current.mots+' mots · Difficulté '+current.etoiles+'/12';header.append(meta);if(kind==='result'){if(!submitted)return;const student=$('studentName').value.trim();if(student){const p=document.createElement('p');p.textContent='Nom : '+student;header.append(p)}if(timerUsed){const p=document.createElement('p');p.textContent='Chronomètre : '+document.querySelector('.timerDisplay').textContent;header.append(p)}const fields=[...$('quizForm').children];const score=fields.reduce((n,f,i)=>{const checked=f.querySelector('input:checked');return n+(checked&&Number(checked.value)===current.qcm[i].reponse?1:0)},0);const result=document.createElement('h2');result.textContent='Résultat : '+score+' / 10';header.append(result);const heading=document.createElement('h2');heading.textContent='Corrigé du questionnaire';sheet.append(heading);for(const [i,q] of current.qcm.entries()){const wrap=document.createElement('div');wrap.className='printQuestion';const question=document.createElement('strong');question.textContent=q.numero+'. '+q.question;wrap.append(question);const checked=fields[i].querySelector('input:checked');const selected=checked?Number(checked.value):-1;if(selected!==q.reponse){const line=document.createElement('div');line.className='printOption wrong';line.textContent='✗ '+(selected<0?'Aucune réponse':String.fromCharCode(97+selected)+'. '+q.options[selected]);wrap.append(line)}const correct=document.createElement('div');correct.className='printOption right';correct.textContent='✓ '+String.fromCharCode(97+q.reponse)+'. '+q.options[q.reponse];wrap.append(correct);sheet.append(wrap)}return}if(kind!=='qcm'){const h=document.createElement('h2');h.textContent='Texte';sheet.append(h);const t=document.createElement('div');t.className='printStory';t.textContent=current.texte;sheet.append(t);const att=document.createElement('p');att.style.fontSize='8pt';att.textContent=attribution(current);sheet.append(att)}if(kind!=='text'){const h=document.createElement('h2');h.textContent='Questionnaire de compréhension';sheet.append(h);for(const q of current.qcm){const wrap=document.createElement('div');wrap.className='printQuestion';const question=document.createElement('strong');question.textContent=q.numero+'. '+q.question;wrap.append(question);q.options.forEach((option,i)=>{const line=document.createElement('div');line.className='printOption';line.textContent='☐ '+String.fromCharCode(97+i)+'. '+option;wrap.append(line)});sheet.append(wrap)}}}
function printSection(section){if(section==='result'&&!submitted)return;makePrintSheet(section);document.body.classList.remove('print-text','print-qcm','print-both','print-result');document.body.classList.add('print-'+section);window.print()}
window.addEventListener('afterprint',()=>document.body.classList.remove('print-text','print-qcm','print-both','print-result'));$('printText').addEventListener('click',()=>printSection('text'));$('printQcm').addEventListener('click',()=>printSection('qcm'));$('printBoth').addEventListener('click',()=>printSection('both'));$('printResult').addEventListener('click',()=>printSection('result'));
fetch('corpus.json').then(r=>{if(!r.ok)throw Error('Fichier corpus.json inaccessible');return r.json()}).then(data=>{corpus=validate(data);$('number').max=Math.max(...corpus.map(r=>r.numero));renderDifficultyPicker();renderKeywords();$('number').placeholder=corpus[0].numero+'–'+corpus[corpus.length-1].numero;}).catch(err=>{$('loadError').textContent='Impossible de charger les récits : '+err.message+'. Le site doit être ouvert depuis un serveur web (GitHub Pages, par exemple).';$('loadError').classList.remove('hidden');$('random').disabled=true;$('choose').disabled=true});
</script></body></html>
